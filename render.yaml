services:
  - type: web
    name: voreq-web
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: voreq-db
          property: connectionString
databases:
  - name: voreq-db
    plan: 0.1c-256mb
    ipAllowList: []

