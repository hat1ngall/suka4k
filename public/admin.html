<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Промокоды — mupple</title><script>try{if(localStorage.getItem('theme')==='dark')document.documentElement.dataset.theme='dark'}catch(e){}</script>
<style>@font-face{font-family:Manrope;src:url('/assets/Manrope.ttf')}*{box-sizing:border-box}:root{--bg:#fff1f7;--card:#fffafd;--ink:#2c1736;--line:#e7ccdc;--muted:#8b7487;--pink:#ef3d8e}html[data-theme=dark]{--bg:#100d12;--card:#18131b;--ink:#fff0f9;--line:#594452;--muted:#c2aabc;--pink:#ff74b2}body{margin:0;background:var(--bg);color:var(--ink);font-family:Manrope,Arial,sans-serif}.bar{display:flex;gap:20px;align-items:center;padding:20px 4%;background:var(--card);border-bottom:1px solid var(--line)}.brand{font-size:30px;letter-spacing:-2px;font-weight:900;color:var(--pink);text-decoration:none}.bar a:not(.brand){color:var(--ink);text-decoration:none}.theme{margin-left:auto}button,input{font:inherit}.theme,button{cursor:pointer}main{max-width:720px;margin:45px auto;padding:0 20px}.panel{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:28px;box-shadow:6px 7px 0 #d6abc633}h1{font-size:27px;margin-top:0}h2{font-size:19px}p{color:var(--muted);line-height:1.6}label{font-size:13px;font-weight:800;display:block;margin:18px 0 7px}input{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)}button{border:0;border-radius:10px;background:var(--pink);color:#fff;padding:12px 16px;font-weight:800;margin-top:14px}.theme{margin:0;background:var(--card);border:1px solid var(--line);color:var(--ink)}.secondary{background:transparent;color:var(--pink);border:1px solid var(--line)}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;border-top:1px solid var(--line);padding:12px 0}.row button{margin:0}.message{color:var(--pink);font-size:13px}.muted{color:var(--muted);font-size:12px}[hidden]{display:none!important}</style></head><body><header class="bar"><a class="brand" href="/home">mupple</a><a href="/home">← На главную</a><button class="theme" type="button" aria-label="Сменить тему">☀️ 🌙</button></header><main><section class="panel"><div id="login-panel"><h1>Вход в админ-панель</h1><p>Для управления промокодами введи пароль администратора.</p><form id="login"><label for="password">Пароль администратора</label><input id="password" type="password" autocomplete="current-password" required><button type="submit">Войти</button></form><p class="message" id="login-message" role="alert"></p></div><div id="admin-panel" hidden><h1>Промокоды</h1><p>Создавай коды со скидкой в процентах. Скидка отображается в корзине; оплата пока не подключена.</p><form id="create"><label for="code">Промокод</label><input id="code" minlength="3" maxlength="32" pattern="[A-Za-z0-9_-]{3,32}" placeholder="Например, MUPPLE10" required><label for="percent">Скидка, %</label><input id="percent" type="number" min="1" max="100" step="1" required><button type="submit">Создать промокод</button></form><p class="message" id="message" role="status"></p><h2>Все промокоды</h2><div id="list"></div><button class="secondary" id="logout" type="button">Выйти</button></div></section></main><script>
const loginPanel=document.querySelector('#login-panel'),adminPanel=document.querySelector('#admin-panel'),loginMessage=document.querySelector('#login-message'),message=document.querySelector('#message');
async function request(path,options={}){const res=await fetch('/api/admin/'+path,{credentials:'same-origin',...options,headers:{...(options.body?{'Content-Type':'application/json'}:{}),...options.headers}});let data;try{data=await res.json()}catch{throw new Error('Сервер недоступен')}if(!res.ok)throw new Error(data.error||'Произошла ошибка');return data}
async function showPromos(){const data=await request('promos');loginPanel.hidden=true;adminPanel.hidden=false;const list=document.querySelector('#list');list.replaceChildren();if(!data.promos.length){list.textContent='Пока нет промокодов.';return}data.promos.forEach(promo=>{const row=document.createElement('div');row.className='row';const label=document.createElement('span');label.textContent=promo.code+' — '+promo.percent+'%'+(promo.active?'':' · отключён');row.append(label);if(promo.active){const disable=document.createElement('button');disable.type='button';disable.className='secondary';disable.textContent='Отключить';disable.addEventListener('click',async()=>{try{await request('promos/deactivate',{method:'POST',body:JSON.stringify({code:promo.code})});await showPromos()}catch(error){message.textContent=error.message}});row.append(disable)}list.append(row)})}
document.querySelector('#login').addEventListener('submit',async event=>{event.preventDefault();loginMessage.textContent='';try{await request('login',{method:'POST',body:JSON.stringify({password:document.querySelector('#password').value})});document.querySelector('#password').value='';await showPromos()}catch(error){loginMessage.textContent=error.message}});
document.querySelector('#create').addEventListener('submit',async event=>{event.preventDefault();message.textContent='';try{await request('promos',{method:'POST',body:JSON.stringify({code:document.querySelector('#code').value,percent:Number(document.querySelector('#percent').value)})});event.target.reset();message.textContent='Промокод создан';await showPromos()}catch(error){message.textContent=error.message}});
document.querySelector('#logout').addEventListener('click',async()=>{try{await request('logout',{method:'POST'});adminPanel.hidden=true;loginPanel.hidden=false}catch(error){message.textContent=error.message}});
document.querySelector('.theme').addEventListener('click',()=>{const theme=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=theme;try{localStorage.setItem('theme',theme)}catch(e){}});showPromos().catch(()=>{});
</script></body></html>
